<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forecast Jakarta</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <style>
      .badge-cold {
        background-color: #0d6efd; /* Bootstrap Primary */
      }
      .badge-hot {
        background-color: #dc3545; /* Bootstrap Danger */
      }
      .badge-warm {
        background-color: #ffc107; /* Bootstrap Warning */
      }
    </style>
  </head>
  <body>
    <div class="container mt-4">
      <h1 class="mb-4">Weather Forecast in Jakarta</h1>

      <!-- Tambahkan di bawah judul -->
    <div class="row mb-3">
      <div class="col-6">
        <label for="date-filter" class="form-label">Filter by Date</label>
        <select class="form-select" id="date-filter">
          <option value="">All Dates</option>
          <!-- Options diisi oleh TypeScript -->
        </select>
      </div>
    </div>


      <table class="table table-striped">
        <thead>
          <tr>
            <th>Time</th>
            <th>Temperature</th>
          </tr>
        </thead>
        <tbody id="weather-table-body">
          <!-- Data diisi oleh TypeScript -->
        </tbody>
      </table>

      <nav>
        <ul class="pagination" id="pagination"></ul>
      </nav>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
